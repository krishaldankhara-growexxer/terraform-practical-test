version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "=== Install phase ==="
      - yum install -y nginx git unzip || true

  pre_build:
    commands:
      - echo "=== Pre-build phase ==="
      - echo "Build started on $(date)"
      - echo "Branch/Commit: $CODEBUILD_SOURCE_VERSION"

  build:
    commands:
      - echo "=== Build phase ==="
      - echo "Build complete."

  post_build:
    commands:
      - echo "=== Post-build phase ==="
      - echo "Build finished on $(date)"

artifacts:
  base-directory: terraform/dev/cicd_assets
  files:
    - appspec.yml
    - scripts/**/*

cache:
  paths:
    - '/root/.cache/pip/**/*'
